<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>미국 경제지표 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
<div id="statusMsg">데이터 불러오는 중...</div>
<div id="mainContent" style="display:none;">
  <canvas id="chartCpiRate"></canvas>
  <canvas id="chartUn"></canvas>
</div>

<script>
function renderDashboard(DATA) {
  // 여기에 9.7절 애드온의 KPI 채우기, new Chart(...) 코드를 그대로 붙여넣는다.
  // 단, 맨 위의 "const DATA = {...}" 하드코딩 줄은 없앤다. 이제 DATA는
  // 아래 fetch가 함수 인자로 넘겨주기 때문이다.
}

// 이 HTML과 같은 docs 폴더 안의 data/dashboard_data.json을 상대경로로 불러온다.
// (GitHub Pages는 docs 폴더 "안"만 공개하므로, 폴더 밖으로 나가는 경로는 쓰지 않는다.)
fetch('data/dashboard_data.json')
  .then(res => {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  })
  .then(data => {
    document.getElementById('statusMsg').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    renderDashboard(data);
  })
  .catch(err => {
    document.getElementById('statusMsg').textContent =
      '데이터를 불러오지 못했습니다 (' + err.message + '). ' +
      'data/dashboard_data.json 파일이 있는지, GitHub Actions가 ' +
      '정상 실행됐는지 확인하세요.';
  });
</script>
</body>
</html>
